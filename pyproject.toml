[project]
name = "dopplertrack"
version = "0.1.0"
description = "Acoustic geolocation from inaudible aircraft Doppler curves matched against ADS-B flight tracks"
readme = "README.md"
authors = [
    { name = "Mac", email = "mac@nevada.unr.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.scripts]
dopplertrack = "dopplertrack.cli:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
